# Reverse proxy in front of gunicorn. Installed to /etc/nginx/sites-available/myapp.
#
# GitLab's bundled nginx already owns port 80 on this host, so the application
# is published on 8088 instead. gunicorn itself only listens on 127.0.0.1:8000.

# This file is included inside nginx's http block, so the zone can be declared here.
limit_req_zone $binary_remote_addr zone=myapp_per_ip:10m rate=10r/s;

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    server_tokens off;

    location / {
        limit_req zone=myapp_per_ip burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
